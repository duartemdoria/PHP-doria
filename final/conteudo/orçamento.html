<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedido de Orçamento</title>
  <link rel="stylesheet" href="style_orcamento.css">
  <script src="script.js" defer></script>
</head>
<body>
<form onsubmit="return validarCamposObrigatorios()"></form>
  <div class="form-container">
    <h2>Dados</h2>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="apelido">Apelido:</label>
    <input type="text" id="apelido" name="apelido">

    <label for="telemovel">Telemóvel:</label>
    <input type="tel" id="telemovel" name="telemovel" pattern="[0-9]{9}" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="tipo">Tipo de página web:</label>
    <select id="tipo" name="tipo" onchange="calcularOrcamento()">
      <option value="">Selecione</option>
      <option value="institucional">Institucional</option>
      <option value="portfolio">Portfólio</option>
      <option value="loja">Loja Online</option>
    </select>

    <label for="prazo">Prazo em meses:</label>
    <input type="number" id="prazo" oninput="calcularOrcamento()" min="0">

    <div class="checkbox-group">
      <strong>Separadores Desejados (400€ cada):</strong>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> Quem somos</label>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> Onde estamos</label>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> Galeria de fotografias</label>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> eCommerce</label>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> Gestão interna</label>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> Notícias</label>
      <label><input type="checkbox" class="separador" onchange="calcularOrcamento()"> Redes sociais</label>
    </div>

    <div class="estimated">Orçamento estimado:</div>
    <div class="estimate-box" id="orcamento">€0.00</div>
    <button type="submit" onsubmit="return validarCamposObrigatorios()">Enviar</button>
  </div>
 
</form>


</body>
</html>
